# Tool configuration only — Creuset is a set of scripts, not an installable package.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
extend-exclude = ["logs"]

[tool.ruff.lint]
# Pyflakes + syntax errors: real bugs (undefined names, unused imports), not style.
select = ["F", "E9"]
