# ─────────────────────────────────────────────────────────────────────────────
# Creuset — Docker Compose
#
# Networks
#   creuset-net   internal: true — THE SANDBOX. Nothing attached to it can
#                 reach the internet. Agents (per-test containers and the
#                 blue/green slots) and mock-services live only here.
#   creuset-edge  ordinary bridge. Only two dual-homed containers join it:
#                   llm-proxy — the single EGRESS point (LLM API only)
#                   router    — the single INGRESS point (live traffic)
#
#        internet ◄── llm-proxy ◄─┐            ┌─► agent-blue ─┐
#   (LLM API only)   (allowlist,  │ creuset-net│               ├─► mock-services
#                     injects key)└────────────┴─► agent-green ┘
#        host:8081 ──► router ────────────────────┘ (active slot from deploy/state/)
#
# Secrets
#   The real LLM key (LLM_API_KEY in .env) is given ONLY to llm-proxy, which
#   injects it into upstream requests. Agents run with a placeholder key, so
#   a hijacked agent has no real credential to exfiltrate.
#
# Typical use
#   docker compose build
#   docker compose up -d llm-proxy mock-services   # needed for gate runs
#   docker compose up -d                           # + blue/green slots + router
#
# Native Linux: the slots write ./logs/live_traffic as CREUSET_UID:CREUSET_GID
# (default 10001:10001, the image's user). Set them to your `id -u` / `id -g`
# so that directory is writable; otherwise the slots report unhealthy.
# ─────────────────────────────────────────────────────────────────────────────

name: creuset

networks:
  creuset-net:
    name: creuset-net
    driver: bridge
    internal: true   # ← CRITICAL: no outbound internet from the sandbox
  creuset-edge:
    name: creuset-edge
    driver: bridge

# Environment shared by every agent container. The same names and defaults as
# sandbox/run_test.py _container_env() passes to the one-shot containers the gate
# tests, so a slot runs the configuration that passed — a setting missing here
# would silently fall back to the agent's own default in production only.
# (CREUSET_RUN_ID and CREUSET_TOOLS_URL are per test run; serve.py makes its own
# run id per request.) tests/test_serve.py holds the two in step.
x-agent-env: &agent-env
  OPENAI_API_BASE: ${AGENT_API_BASE:-http://llm-proxy:11434/openai/v1}
  # The name the official openai SDK reads; neutral for the bundled agent.
  OPENAI_BASE_URL: ${AGENT_API_BASE:-http://llm-proxy:11434/openai/v1}
  OPENAI_API_KEY: sandbox-placeholder-key   # real key is injected by llm-proxy
  AGENT_MODEL: ${AGENT_MODEL:?set AGENT_MODEL in .env}
  MOCK_SERVICES_HOST: mock-services
  MOCK_SERVICES_PORT: "8001"
  MAX_LLM_CALLS: ${MAX_LLM_CALLS:-15}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-8}
  AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-700}
  FINALIZER_MAX_TOKENS: ${FINALIZER_MAX_TOKENS:-1024}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
  LIVE_TRAFFIC_DIR: /app/live_traffic

x-agent-slot: &agent-slot
  build:
    context: ./agent
  # The tag the harness runs as the bundled agent (sandbox/run_test.py
  # bundled_image_ref), so `docker compose build agent-blue` rebuilds the image
  # the gate tests and the slots serve — under one name, whatever it is.
  image: ${AGENT_IMAGE_TAG:-creuset-agent:latest}
  entrypoint: ["uvicorn", "serve:app", "--host", "0.0.0.0", "--port", "8000"]
  command: []
  # The uid that writes ./logs/live_traffic. Docker Desktop (Windows, macOS)
  # hides host ownership, so the image's own uid works there. Native Linux keeps
  # it: a checkout owned by you is not writable by 10001, and the monitor would
  # watch an empty directory. There, set CREUSET_UID/CREUSET_GID to `id -u` /
  # `id -g`. The image's files are world-readable, so any uid can run it.
  user: "${CREUSET_UID:-10001}:${CREUSET_GID:-10001}"
  networks:
    - creuset-net
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - ./logs/live_traffic:/app/live_traffic
  # /health is 503 while the slot cannot write live traffic (agent/serve.py),
  # so `up --wait` — and the gate's staging step — fail rather than deploy a
  # slot the monitor cannot see. The image's own Python rather than curl, so
  # the check does not depend on curl being installed.
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 5
  deploy:
    resources:
      limits:
        memory: 512m
        pids: 256
        cpus: "1.00"
  depends_on:
    mock-services:
      condition: service_healthy
    llm-proxy:
      condition: service_healthy
  restart: unless-stopped

services:

  # ── LLM egress gateway ────────────────────────────────────────────────────
  llm-proxy:
    image: nginx:1.31-alpine
    container_name: llm-proxy
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      LLM_UPSTREAM_HOST: ${LLM_UPSTREAM_HOST:-api.groq.com}
      LLM_PROXY_RESOLVER: ${LLM_PROXY_RESOLVER:-127.0.0.11}
      # Provider profile, validated (and defaulted, for any unset here) by
      # 05-creuset-validate.envsh. These defaults render the Groq config
      # byte-for-byte; see that script for what each one may be.
      LLM_UPSTREAM_SCHEME: ${LLM_UPSTREAM_SCHEME:-https}
      LLM_UPSTREAM_PORT: ${LLM_UPSTREAM_PORT:-}
      LLM_UPSTREAM_PATH_PREFIX: ${LLM_UPSTREAM_PATH_PREFIX:-}
      LLM_ALLOWED_ENDPOINTS: "${LLM_ALLOWED_ENDPOINTS:-chat/completions|models}"
      LLM_AUTH_HEADER: ${LLM_AUTH_HEADER:-Authorization}
      LLM_AUTH_PREFIX: ${LLM_AUTH_PREFIX:-}
      LLM_PROXY_EXTRA_CA_FILE: ${LLM_PROXY_EXTRA_CA_FILE:-}
    volumes:
      - ./deploy/llm-proxy:/etc/nginx/templates:ro
      # Sourced by the image's entrypoint before the template is rendered. If it
      # is missing, nginx refuses the config rather than start unvalidated.
      - ./deploy/llm-proxy/05-creuset-validate.envsh:/docker-entrypoint.d/05-creuset-validate.envsh:ro
    # The one container holding the real key gets the tightest box: read-only
    # root (the rendered config, cache and pid file live in tmpfs) and only the
    # three capabilities the nginx master needs to hand workers to `nginx`.
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      creuset-edge: {}
      creuset-net:
        aliases:
          - llm-proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:11434/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64m
          pids: 64
          cpus: "0.50"
    restart: unless-stopped

  # ── Mock services (fake REST API, per-run isolated worlds) ────────────────
  mock-services:
    build:
      context: ./sandbox/mock_services
    image: creuset-mock-services:latest
    container_name: mock-services
    environment:
      # 1 = refuse tool calls for a run nobody initialised (no shared world).
      # Anything but 1/0/true/false/yes/no/on/off stops it from starting.
      MOCK_STRICT_RUNS: ${MOCK_STRICT_RUNS:-0}
    networks:
      - creuset-net
    # Holds the audit log the judge treats as ground truth, and shares a network
    # with the agents under test — so it is boxed as tightly as they are.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 128
          cpus: "0.50"
    healthcheck:
      # The image's own Python rather than curl, so the check does not depend
      # on curl being installed.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Blue / green slots (long-running agent service) ───────────────────────
  # Which variant/version each slot runs is recorded in deploy/state/<slot>.env,
  # written by the gate on deployment (see deploy/switch.py). If the file is
  # missing the image default (AGENT_VARIANT=hardened) applies.
  agent-blue:
    <<: *agent-slot
    container_name: agent-blue
    env_file:
      - path: ./deploy/state/blue.env
        required: false
    environment:
      <<: *agent-env
      SLOT: blue

  agent-green:
    <<: *agent-slot
    container_name: agent-green
    env_file:
      - path: ./deploy/state/green.env
        required: false
    environment:
      <<: *agent-env
      SLOT: green

  # ── Router (blue-green traffic switch, the only ingress) ──────────────────
  router:
    build:
      context: ./deploy
      dockerfile: Dockerfile.router
    image: creuset-router:latest
    container_name: creuset-router
    networks:
      - creuset-edge
      - creuset-net
    ports:
      - "127.0.0.1:${ROUTER_HOST_PORT:-8081}:8080"
    environment:
      ROUTER_PORT: "8080"
      STATE_FILE: /app/state/state.json   # wins over CREUSET_STATE_DIR
      # /invoke runs a whole agent scenario, which can outlast 30 s on a slow or
      # rate-limited model. Must be a positive number, or the router will not start.
      ROUTER_UPSTREAM_TIMEOUT: ${ROUTER_UPSTREAM_TIMEOUT:-30}
    volumes:
      - ./deploy/state:/app/state:ro   # router reads the active slot live
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 128
          cpus: "0.25"
    restart: unless-stopped
